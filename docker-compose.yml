# Configuración base = producción (sin proxy, IA con Ollama).
# En dev se combina con docker-compose.dev.yml (ver README).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recetas}
      POSTGRES_USER: ${POSTGRES_USER:-recetas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recetas}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # Solo accesible desde la propia máquina; la web (red del host) se conecta por aquí.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./app
    restart: unless-stopped
    # Red del host: la web llega a Ollama en 127.0.0.1:11434 (Ollama solo escucha en localhost)
    # y publica directamente el puerto 8085.
    network_mode: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8085"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${POSTGRES_HOST_PORT:-5433}
      PGDATABASE: ${POSTGRES_DB:-recetas}
      PGUSER: ${POSTGRES_USER:-recetas}
      PGPASSWORD: ${POSTGRES_PASSWORD:-recetas}
      # IA para "Testutik sortu": ollama (producción, por defecto) o anthropic (dev). Ver .env.example.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}

volumes:
  pgdata:
